<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 1.1em;
        }

        input[type="text"], input[type="url"], select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        input[type="text"]:focus, input[type="url"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            padding-right: 45px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .color-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 30px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            text-align: center;
            margin-top: 30px;
        }

        .qr-result {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            border: 2px dashed #dee2e6;
        }

        .qr-result img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .download-btn {
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        .download-btn:hover {
            background: #218838;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            .options-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔲 QR Code Generator</h1>
        
                <form id="qrForm">
            <div class="form-group">
                <label for="contentType">Content Type:</label>
                <select id="contentType" name="contentType" required>
                    <option value="url">Website URL</option>
                    <option value="text">Plain Text</option>
                    <option value="wifi">WiFi Network</option>
                    <option value="sms">SMS Message</option>
                    <option value="email">Email</option>
                    <option value="phone">Phone Number</option>
                    <option value="vcard">Contact Card</option>
                </select>
            </div>

            <div class="form-group">
                <label for="url" id="primaryLabel">Primary Data:</label>
                <input type="text" id="url" name="url" placeholder="Enter URL, text, or primary data" required>
            </div>

            <div class="form-group">
                <label for="secondaryData" id="secondaryLabel">Secondary Data:</label>
                <input type="text" id="secondaryData" name="secondaryData" placeholder="Additional data (password, message, etc.)">
            </div>

            <div class="form-group">
                <label for="scanText">Scan instruction text (appears above QR code):</label>
                <input type="text" id="scanText" placeholder="Point your camera here" maxlength="50">
            </div>

            <div class="form-group">
                <label for="scanTitle">Title text (appears below QR code):</label>
                <input type="text" id="scanTitle" placeholder="Scan Me" maxlength="30">
            </div>

            <div class="options-grid">
                <div class="form-group">
                    <label for="frameColor">Frame Color:</label>
                    <div class="color-input-group">
                        <input type="color" id="frameColor" value="#000000">
                        <span id="frameColorText">#000000</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="textColor">Text Color:</label>
                    <div class="color-input-group">
                        <input type="color" id="textColor" value="#000000">
                        <span id="textColorText">#000000</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="frameWidth">Frame Width (px):</label>
                    <input type="number" id="frameWidth" value="10" min="0" max="50">
                </div>

                <div class="form-group">
                    <label for="fontSize">Text Size (px):</label>
                    <input type="number" id="fontSize" value="24" min="12" max="48">
                </div>
            </div>

            <button type="submit" class="generate-btn">Generate QR Code</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Generating your QR code...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="result" class="result-container" style="display: none;">
            <div class="qr-result">
                <img id="qrImage" src="" alt="Generated QR Code">
                <br>
                <button id="downloadBtn" class="download-btn">Download QR Code</button>
            </div>
        </div>
    </div>

    <script>
        // Content type handling
        function updateFormLabels() {
            const contentType = document.getElementById('contentType').value;
            const primaryLabel = document.getElementById('primaryLabel');
            const secondaryLabel = document.getElementById('secondaryLabel');
            const urlInput = document.getElementById('url');
            const secondaryInput = document.getElementById('secondaryData');

            switch(contentType) {
                case 'url':
                    primaryLabel.textContent = 'Website URL:';
                    secondaryLabel.textContent = 'Custom Scan Text (optional):';
                    urlInput.placeholder = 'https://example.com';
                    secondaryInput.placeholder = 'Optional: Custom text to display when scanned';
                    break;
                case 'text':
                    primaryLabel.textContent = 'Text to Encode:';
                    secondaryLabel.textContent = 'Alternative Text (optional):';
                    urlInput.placeholder = 'Enter the text to encode in QR code';
                    secondaryInput.placeholder = 'This will override the primary text when scanned';
                    break;
                case 'wifi':
                    primaryLabel.textContent = 'WiFi Network Name (SSID):';
                    secondaryLabel.textContent = 'WiFi Password:';
                    urlInput.placeholder = 'MyWiFiNetwork';
                    secondaryInput.placeholder = 'WiFi password';
                    break;
                case 'sms':
                    primaryLabel.textContent = 'Phone Number:';
                    secondaryLabel.textContent = 'Message:';
                    urlInput.placeholder = '+1234567890';
                    secondaryInput.placeholder = 'Pre-filled SMS message';
                    break;
                case 'email':
                    primaryLabel.textContent = 'Email Address:';
                    secondaryLabel.textContent = 'Email Body:';
                    urlInput.placeholder = 'contact@example.com';
                    secondaryInput.placeholder = 'Pre-filled email message';
                    break;
                case 'phone':
                    primaryLabel.textContent = 'Phone Number:';
                    secondaryLabel.textContent = 'Note (optional):';
                    urlInput.placeholder = '+1234567890';
                    secondaryInput.placeholder = 'Optional note';
                    break;
                case 'vcard':
                    primaryLabel.textContent = 'Full Name:';
                    secondaryLabel.textContent = 'Phone Number:';
                    urlInput.placeholder = 'John Doe';
                    secondaryInput.placeholder = '+1234567890';
                    break;
            }
        }

        // Initialize form labels
        updateFormLabels();

        // Update labels when content type changes
        document.getElementById('contentType').addEventListener('change', updateFormLabels);

        // Update color display text
        document.getElementById('frameColor').addEventListener('input', function(e) {
            document.getElementById('frameColorText').textContent = e.target.value;
        });

        document.getElementById('textColor').addEventListener('input', function(e) {
            document.getElementById('textColorText').textContent = e.target.value;
        });

        // Form submission
        document.getElementById('qrForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                url: document.getElementById('url').value,
                contentType: document.getElementById('contentType').value,
                secondaryData: document.getElementById('secondaryData').value,
                scanText: document.getElementById('scanText').value,
                scanTitle: document.getElementById('scanTitle').value,
                frameColor: document.getElementById('frameColor').value,
                textColor: document.getElementById('textColor').value,
                frameWidth: parseInt(document.getElementById('frameWidth').value),
                fontSize: parseInt(document.getElementById('fontSize').value)
            };

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch('/api/generate-enhanced', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                // Display result
                document.getElementById('qrImage').src = imageUrl;
                document.getElementById('result').style.display = 'block';
                
                // Setup download
                document.getElementById('downloadBtn').onclick = function() {
                    const a = document.createElement('a');
                    a.href = imageUrl;
                    a.download = `qr-code-${Date.now()}.png`;
                    a.click();
                };

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error').textContent = 'Error generating QR code: ' + error.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
